name: Sync Latest Connectivity Outputs to Supabase

on:
  push:
    branches:
      - master
      - main
    paths:
      - "outputs/village_provider_signal_estimate.csv"
      - "outputs/village_connectivity_summary.xlsx"
      - "config.yaml"
      - "connectivity_pipeline/**"
      - "sync_supabase_from_outputs.py"
      - ".github/workflows/supabase-sync.yml"
  workflow_dispatch:
    inputs:
      provider_csv:
        description: Path to the latest provider CSV output
        required: false
        default: outputs/village_provider_signal_estimate.csv

permissions:
  contents: read

concurrency:
  group: supabase-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyyaml requests

      - name: Resolve provider CSV path
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.provider_csv }}" ]; then
            echo "PROVIDER_CSV=${{ github.event.inputs.provider_csv }}" >> "$GITHUB_ENV"
          else
            echo "PROVIDER_CSV=outputs/village_provider_signal_estimate.csv" >> "$GITHUB_ENV"
          fi

      - name: Preflight Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()
          endpoint = f"{url}/rest/v1/connectivity_runs?select=run_id&limit=1"
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          response = requests.get(endpoint, headers=headers, timeout=30)
          print(f"Preflight status: {response.status_code}")
          if response.status_code == 404:
              print("Supabase REST endpoint returned 404. Check that SUPABASE_URL is the project API URL, not the dashboard URL.")
              sys.exit(1)
          if response.status_code in {401, 403}:
              print("Supabase REST endpoint is reachable, but the key is not accepted. Check the service role key.")
              sys.exit(1)
          if response.status_code >= 400:
              print(response.text[:500])
              sys.exit(1)
          PY

      - name: Sync outputs to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA }}
          SUPABASE_TABLE_PREFIX: ${{ secrets.SUPABASE_TABLE_PREFIX }}
        run: |
          python sync_supabase_from_outputs.py --config config.yaml --provider-csv "$PROVIDER_CSV"
